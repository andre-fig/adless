name: Open beta to main PR

on:
  push:
    branches:
      - beta

concurrency:
  group: open-beta-to-main-pr
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  open-promotion-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open promotion PR if needed
        run: |
          set -euo pipefail

          existing_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head beta \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "PR #$existing_pr from beta to main is already open."
            exit 0
          fi

          ahead_by="$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/main...beta" \
            --jq '.ahead_by')"
          if [ "$ahead_by" -eq 0 ]; then
            echo "beta has no commits pending in main."
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head beta \
            --title "Promote beta to main" \
            --body "Automated promotion PR from beta to main. Review is required; this workflow never merges the PR."
