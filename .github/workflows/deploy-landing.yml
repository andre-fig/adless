name: Deploy Adless landing to Railway

on:
  push:
    branches:
      - main
    paths:
      - "apps/landing-page/src/**"
      - "apps/landing-page/index.html"
      - "apps/landing-page/vite.config.ts"
      - "apps/landing-page/tsconfig*.json"
      - "apps/landing-page/package.json"
      - "apps/landing-page/public/adless-favicon.png"
      - "apps/landing-page/public/favicon.ico"
      - "apps/landing-page/public/placeholder.svg"
      - "apps/landing-page/public/robots.txt"
      - "apps/landing-page/public/blocklists/manifest.json"
      - "apps/landing-page/public/blocklists/blocklist.txt"
      - "apps/landing-page/public/blocklists/blocklist.txt.gz"
      - "apps/landing-page/public/blocklists/blocklist.sha256"
      - "package-lock.json"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

concurrency:
  group: railway-landing-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build landing
        run: npm run build:landing

      - name: Deploy landing to Railway production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: a3f28c5a-d16c-41c3-9bf8-9594edfe63f6
          RAILWAY_SERVICE_ID: 47877f5b-d67e-47e5-9cd6-410ef1e057f4
        run: |
          set -euo pipefail
          test -n "$RAILWAY_TOKEN" || { echo "RAILWAY_TOKEN secret is missing" >&2; exit 1; }
          test -n "$RAILWAY_PROJECT_ID" || { echo "RAILWAY_PROJECT_ID secret is missing" >&2; exit 1; }
          test -n "$RAILWAY_SERVICE_ID" || { echo "RAILWAY_SERVICE_ID secret is missing" >&2; exit 1; }
          npx --yes @railway/cli@5.49.2 up apps/landing-page \
            --path-as-root \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --ci
