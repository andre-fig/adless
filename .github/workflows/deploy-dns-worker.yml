name: Deploy Adless DNS Worker

on:
  push:
    branches:
      - main
    paths:
      - "apps/dns-worker/**"
      - "tools/blocklists/**"
      - "tools/dns-worker/**"
      - ".github/workflows/deploy-dns-worker.yml"
  workflow_dispatch:

concurrency:
  group: adless-dns-worker-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run blocklist tests
        run: python3 -m unittest discover -s tools/blocklists/tests -v

      - name: Run Worker tests
        run: npm run test:dns-worker

      - name: Prepare and validate the edge blocklist
        run: |
          python3 tools/dns-worker/prepare_blocklist.py
          python3 tools/blocklists/validate_blocklist.py
          npm run build:dns-worker

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret is missing" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID secret is missing" >&2; exit 1; }
          npx --yes wrangler@4 deploy --config apps/dns-worker/wrangler.toml
