name: Upload Adless to TestFlight

on:
  workflow_dispatch:

concurrency:
  group: adless-ios-distribution
  cancel-in-progress: false

permissions:
  contents: read

env:
  ASC_APP_ID: "6803552143"
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_ORG: orbeworks
  SENTRY_PROJECT: adless
  ASC_INTERNAL_BETA_GROUP_ID: "7582fab8-73d9-41ec-b544-0392c7cfa4b0"
  IOS_PROJECT: apps/ios/Adless.xcodeproj
  IOS_SCHEME: Adless

jobs:
  upload:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/beta'
    runs-on: macos-latest
    timeout-minutes: 75
    # Serialize settings updates with the production Worker deployment workflow.
    # Do not cancel a running upload or overwrite a concurrent allowlist update.
    concurrency:
      group: adless-dns-worker-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check Cloudflare automation credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 tools/dns-worker/testflight_builds.py check

      - name: Prepare App Store Connect API key
        id: credentials
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" || { echo "ASC_KEY_ID secret is missing" >&2; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo "ASC_ISSUER_ID secret is missing" >&2; exit 1; }
          test -n "$ASC_PRIVATE_KEY" || { echo "ASC_PRIVATE_KEY secret is missing" >&2; exit 1; }
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Read marketing version
        id: version
        run: |
          set -euo pipefail
          xcodebuild -project "$IOS_PROJECT" -scheme "$IOS_SCHEME" -configuration Release -showBuildSettings > "$RUNNER_TEMP/Adless-build-settings.txt"
          marketing_version="$(awk -F ' = ' '$1 ~ /^[[:space:]]*MARKETING_VERSION$/ { print $2; exit }' "$RUNNER_TEMP/Adless-build-settings.txt")"
          test -n "$marketing_version"
          echo "marketing_version=$marketing_version" >> "$GITHUB_OUTPUT"

      - name: Check TestFlight version and beta review information
        env:
          IOS_MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
        run: |
          set -euo pipefail
          # Keep the array nonempty: macOS Bash 3.2 + nounset rejects empty arrays.
          review_options=(--group-id "$ASC_INTERNAL_BETA_GROUP_ID")
          if [[ "$GITHUB_REF" == "refs/heads/beta" ]]; then
            review_options+=(--external)
          fi
          python3 tools/appstore/appstore_connect.py \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-path "${{ steps.credentials.outputs.key_path }}" \
            testflight-preflight \
            --app-id "$ASC_APP_ID" \
            --version "$IOS_MARKETING_VERSION" \
            "${review_options[@]}"

      - name: Select next build number
        id: build
        run: |
          set -euo pipefail
          minimum_build="$((GITHUB_RUN_NUMBER + 1))"
          build_number="$(python3 tools/appstore/appstore_connect.py \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-path "${{ steps.credentials.outputs.key_path }}" \
            next-build \
            --app-id "$ASC_APP_ID" \
            --minimum "$minimum_build")"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "Selected TestFlight build $build_number"

      - name: Install Sentry CLI
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          set -euo pipefail
          brew install getsentry/tools/sentry-cli
          sentry-cli --version

      - name: Archive signed iOS app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Adless.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.credentials.outputs.key_path }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="${{ steps.build.outputs.build_number }}"

      - name: Verify intermediate archive layout
        run: |
          set -euo pipefail
          # Automatic signing may use a development profile for this intermediate
          # archive. Distribution signing is checked on the exported IPA below.
          sh tools/ios/verify_archive.sh --layout-only "$RUNNER_TEMP/Adless.xcarchive"

      - name: Export the branch-specific TestFlight package
        run: |
          set -euo pipefail
          export_options=docs/app-store/ExportOptions-TestFlight-Internal.plist
          if [[ "$GITHUB_REF" == "refs/heads/beta" ]]; then
            export_options=docs/app-store/ExportOptions-TestFlight.plist
          fi
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Adless.xcarchive" \
            -exportOptionsPlist "$export_options" \
            -exportPath "$RUNNER_TEMP/Adless-export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.credentials.outputs.key_path }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Verify archive dSYMs
        run: |
          set -euo pipefail
          dsyms_path="$RUNNER_TEMP/Adless.xcarchive/dSYMs"
          test -d "$dsyms_path"
          test -d "$dsyms_path/Adless.app.dSYM"
          test "$(find "$dsyms_path" -mindepth 1 -maxdepth 1 -type d -name '*.appex.dSYM' | wc -l | tr -d '[:space:]')" -eq 0
          echo "Verified the app dSYM and no extension dSYMs in the archive."

      - name: Verify exported IPA contents
        env:
          ADLESS_EXPECTED_BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
          ADLESS_EXPECTED_MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
        run: sh tools/ios/verify_ipa.sh "$RUNNER_TEMP/Adless-export/Adless.ipa"

      - name: Upload archive dSYMs to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          set -euo pipefail
          sh tools/sentry/upload-dsyms.sh "$RUNNER_TEMP/Adless.xcarchive/dSYMs"

      - name: Validate package with Apple
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            --file "$RUNNER_TEMP/Adless-export/Adless.ipa" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Authorize the validated build on the existing Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
        run: |
          set -euo pipefail
          # Update only the allowlist, not the Worker code, routes, or secrets.
          python3 tools/dns-worker/testflight_builds.py add --build-number "$BUILD_NUMBER"

      - name: Upload package to TestFlight
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/Adless-export/Adless.ipa" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Wait for Apple processing
        id: processed-build
        run: |
          set -euo pipefail
          python3 tools/appstore/appstore_connect.py \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-path "${{ steps.credentials.outputs.key_path }}" \
            wait-build \
            --app-id "$ASC_APP_ID" \
            --build-number "${{ steps.build.outputs.build_number }}"

      - name: Distribute only to the internal TestFlight group
        if: github.ref == 'refs/heads/develop'
        run: |
          set -euo pipefail
          python3 tools/appstore/appstore_connect.py \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-path "${{ steps.credentials.outputs.key_path }}" \
            add-beta-build \
            --require-internal \
            --app-id "$ASC_APP_ID" \
            --group-id "$ASC_INTERNAL_BETA_GROUP_ID" \
            --build-id "${{ steps.processed-build.outputs.build_id }}"

      - name: Distribute to external TestFlight groups and submit beta review
        if: github.ref == 'refs/heads/beta'
        id: beta
        run: |
          set -euo pipefail
          python3 tools/appstore/appstore_connect.py \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-path "${{ steps.credentials.outputs.key_path }}" \
            distribute-beta \
            --app-id "$ASC_APP_ID" \
            --notes-file docs/app-store/testflight-notes.txt \
            --build-id "${{ steps.processed-build.outputs.build_id }}"

      - name: Publish summary
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
          IOS_MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          EXTERNAL_STATE: ${{ steps.beta.outputs.external_state }}
        run: |
          {
            echo "## TestFlight upload"
            echo ""
            echo "Version **$IOS_MARKETING_VERSION ($BUILD_NUMBER)** was uploaded and processed."
            if [[ "$GITHUB_REF" == "refs/heads/develop" ]]; then
              echo "Distributed to the internal group only; this IPA cannot be distributed externally."
            else
              echo "Assigned to external groups. Beta status: $EXTERNAL_STATE. Testers are notified automatically once Apple permits testing."
            fi
            echo "The existing DNS Worker allowlist includes this build. No public App Store submission was made."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary Apple API key
        if: always()
        env:
          KEY_PATH: ${{ steps.credentials.outputs.key_path }}
        run: |
          set -euo pipefail
          if [[ -n "$KEY_PATH" && "$KEY_PATH" == "$RUNNER_TEMP"/AuthKey_*.p8 ]]; then
            rm -f -- "$KEY_PATH"
          fi
