name: Release Adless iOS to production after Apple approval

on:
  push:
    branches:
      - main
    paths:
      - "apps/ios/Adless/*.swift"
      - "apps/ios/Adless/Managers/**"
      - "apps/ios/Adless/Services/**"
      - "apps/ios/Adless/Resources/Assets.xcassets/**"
      - "apps/ios/Adless/Resources/Adless.entitlements"
      - "apps/ios/Adless/Resources/Info.plist"
      - "apps/ios/Adless/Resources/Localizable.xcstrings"
      - "apps/ios/Adless.xcodeproj/**"
      - "apps/ios/Configurations/**"
      - "apps/ios/Adless.storekit"
      - "apps/ios/Shared/**"
      - "docs/app-store/ExportOptions.plist"
      - "tools/appstore/**"
      - "tools/ios/**"
      - "tools/sentry/**"
      - ".github/workflows/release-ios.yml"
  workflow_dispatch:

concurrency:
  group: adless-ios-distribution
  cancel-in-progress: false

permissions:
  contents: read

env:
  ASC_APP_ID: "6803552143"
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_ORG: orbeworks
  SENTRY_PROJECT: adless
  IOS_PROJECT: apps/ios/Adless.xcodeproj
  IOS_SCHEME: Adless

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare App Store Connect API key
        id: credentials
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" || { echo "ASC_KEY_ID secret is missing" >&2; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo "ASC_ISSUER_ID secret is missing" >&2; exit 1; }
          test -n "$ASC_PRIVATE_KEY" || { echo "ASC_PRIVATE_KEY secret is missing" >&2; exit 1; }
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Read marketing version
        id: version
        run: |
          set -euo pipefail
          xcodebuild -project "$IOS_PROJECT" -scheme "$IOS_SCHEME" -configuration Release -showBuildSettings > "$RUNNER_TEMP/Adless-build-settings.txt"
          marketing_version="$(awk -F ' = ' '$1 ~ /^[[:space:]]*MARKETING_VERSION$/ { print $2; exit }' "$RUNNER_TEMP/Adless-build-settings.txt")"
          test -n "$marketing_version"
          echo "marketing_version=$marketing_version" >> "$GITHUB_OUTPUT"
          echo "Releasing marketing version $marketing_version"

      - name: Check App Store version state
        id: preflight
        run: |
          set -euo pipefail
          python3 tools/appstore/appstore_connect.py \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-path "${{ steps.credentials.outputs.key_path }}" \
            preflight \
            --app-id "$ASC_APP_ID" \
            --version "${{ steps.version.outputs.marketing_version }}"

      - name: Explain skipped release
        if: steps.preflight.outputs.should_release != 'true'
        env:
          MESSAGE: ${{ steps.preflight.outputs.message }}
        run: |
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Select next build number
        id: build
        if: steps.preflight.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          minimum_build="$((GITHUB_RUN_NUMBER + 1))"
          build_number="$(python3 tools/appstore/appstore_connect.py \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-path "${{ steps.credentials.outputs.key_path }}" \
            next-build \
            --app-id "$ASC_APP_ID" \
            --minimum "$minimum_build")"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "Selected build number $build_number"

      - name: Install Sentry CLI
        if: steps.preflight.outputs.should_release == 'true' && env.SENTRY_AUTH_TOKEN != ''
        run: |
          set -euo pipefail
          brew install getsentry/tools/sentry-cli
          sentry-cli --version

      - name: Archive signed iOS app
        if: steps.preflight.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$IOS_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Adless.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.credentials.outputs.key_path }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ steps.build.outputs.build_number }}"

      - name: Export App Store package
        if: steps.preflight.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Adless.xcarchive" \
            -exportOptionsPlist docs/app-store/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/Adless-export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.credentials.outputs.key_path }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Verify intermediate archive layout
        if: steps.preflight.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          sh tools/ios/verify_archive.sh --layout-only "$RUNNER_TEMP/Adless.xcarchive"

      - name: Verify archive dSYMs
        if: steps.preflight.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          dsyms_path="$RUNNER_TEMP/Adless.xcarchive/dSYMs"
          test -d "$dsyms_path"
          test -d "$dsyms_path/Adless.app.dSYM"
          test "$(find "$dsyms_path" -mindepth 1 -maxdepth 1 -type d -name '*.appex.dSYM' | wc -l | tr -d '[:space:]')" -eq 0
          echo "Verified the app dSYM and no extension dSYMs in the archive."

      - name: Verify exported IPA contents
        if: steps.preflight.outputs.should_release == 'true'
        env:
          ADLESS_EXPECTED_BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
          ADLESS_EXPECTED_MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
        run: sh tools/ios/verify_ipa.sh "$RUNNER_TEMP/Adless-export/Adless.ipa"

      - name: Upload archive dSYMs to Sentry
        if: steps.preflight.outputs.should_release == 'true' && env.SENTRY_AUTH_TOKEN != ''
        run: |
          set -euo pipefail
          sh tools/sentry/upload-dsyms.sh "$RUNNER_TEMP/Adless.xcarchive/dSYMs"

      - name: Validate package with Apple
        if: steps.preflight.outputs.should_release == 'true'
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            --file "$RUNNER_TEMP/Adless-export/Adless.ipa" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload package to App Store Connect
        if: steps.preflight.outputs.should_release == 'true'
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/Adless-export/Adless.ipa" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Wait for Apple processing
        id: processed_build
        if: steps.preflight.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          python3 tools/appstore/appstore_connect.py \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-path "${{ steps.credentials.outputs.key_path }}" \
            wait-build \
            --app-id "$ASC_APP_ID" \
            --build-number "${{ steps.build.outputs.build_number }}"

      - name: Submit for review with automatic production release after approval
        if: steps.preflight.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          python3 tools/appstore/appstore_connect.py \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-path "${{ steps.credentials.outputs.key_path }}" \
            attach-submit \
            --app-id "$ASC_APP_ID" \
            --version "${{ steps.version.outputs.marketing_version }}" \
            --build-id "${{ steps.processed_build.outputs.build_id }}"

      - name: Publish summary
        if: steps.preflight.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
        run: |
          echo "App Store $VERSION ($BUILD_NUMBER) submitted for review; production release is automatic AFTER Apple approval, not immediate." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary Apple API key
        if: always()
        env:
          KEY_PATH: ${{ steps.credentials.outputs.key_path }}
        run: |
          set -euo pipefail
          if [[ -n "$KEY_PATH" && "$KEY_PATH" == "$RUNNER_TEMP"/AuthKey_*.p8 ]]; then
            rm -f -- "$KEY_PATH"
          fi
