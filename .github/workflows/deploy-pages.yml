name: Deploy Adless landing to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/landing-page/src/**"
      - "apps/landing-page/index.html"
      - "apps/landing-page/vite.config.ts"
      - "apps/landing-page/tsconfig*.json"
      - "apps/landing-page/package.json"
      - "apps/landing-page/public/adless-favicon.png"
      - "apps/landing-page/public/favicon.ico"
      - "apps/landing-page/public/placeholder.svg"
      - "apps/landing-page/public/robots.txt"
      - "apps/landing-page/public/blocklists/manifest.json"
      - "apps/landing-page/public/blocklists/blocklist.txt"
      - "apps/landing-page/public/blocklists/blocklist.txt.gz"
      - "apps/landing-page/public/blocklists/blocklist.sha256"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build landing and static blocklist artifacts
        run: npm run build:landing

      - name: Add GitHub Pages SPA fallback
        run: cp apps/landing-page/dist/index.html apps/landing-page/dist/404.html

      - name: Materialize legal page routes
        run: |
          set -euo pipefail
          for route in privacy terms support; do
            mkdir -p "apps/landing-page/dist/$route"
            cp apps/landing-page/dist/index.html "apps/landing-page/dist/$route/index.html"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/landing-page/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
